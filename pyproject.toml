[project]
name = "jeffthisout"
version = "0.1.0"
description = "Zero-/few-shot medical text classification: System-1 decision models (Jeff, Jev) vs generative LLMs"
requires-python = ">=3.12"
dependencies = [
  "jeff[cuda]",
  "scikit-learn>=1.6",
  "pandas>=2.2",
  "pyarrow>=18",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[tool.uv.sources]
jeff = { path = "third_party/jeff" }  # firelex/jeff @ 3720e7c (2026-10-07)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jt"]
